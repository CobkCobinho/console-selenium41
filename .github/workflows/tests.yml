name: Testes Selenium

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restaurar dependencias
        run: dotnet restore ConsoleSelenium41.sln
      - name: Compilar
        run: dotnet build ConsoleSelenium41.sln --configuration Release --no-restore
      - name: Executar os tres cenarios no Chrome
        run: dotnet test ConsoleSelenium41.sln --configuration Release --no-build --logger "trx;LogFileName=selenium.trx" --results-directory TestResults
      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-selenium
          path: TestResults/
          if-no-files-found: warn
